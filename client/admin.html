<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="" />
    <title>Admin · Bonu assai! Pizza</title>
    <script src="js/color-modes.js"></script>
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet" />
    <meta name="theme-color" content="#712cf9" />
  </head>
  <body class="bg-body-tertiary">

      </symbol>
      <symbol id="moon-stars-fill" viewBox="0 0 16 16">

      <symbol id="sun-fill" viewBox="0 0 16 16">
        <path
          d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"
        ></path>
      </symbol>
    </svg>
    <div
      class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle"
    >
      <button
        class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
        id="bd-theme"
        type="button"
        aria-expanded="false"
        data-bs-toggle="dropdown"
        aria-label="Toggle theme (auto)"
      >
        <svg class="bi my-1 theme-icon-active" aria-hidden="true">
          <use href="#circle-half"></use>
        </svg>
        <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
      </button>
      <ul
        class="dropdown-menu dropdown-menu-end shadow"
        aria-labelledby="bd-theme-text"
      >
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center"
            data-bs-theme-value="light"
            aria-pressed="false"
          >
            <svg class="bi me-2 opacity-50" aria-hidden="true">
              <use href="#sun-fill"></use>
            </svg>
            Light
            <svg class="bi ms-auto d-none" aria-hidden="true">
              <use href="#check2"></use>
            </svg>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center"
            data-bs-theme-value="dark"
            aria-pressed="false"
          >
            <svg class="bi me-2 opacity-50" aria-hidden="true">
              <use href="#moon-stars-fill"></use>
            </svg>
            Dark
            <svg class="bi ms-auto d-none" aria-hidden="true">
              <use href="#check2"></use>
            </svg>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="dropdown-item d-flex align-items-center active"
            data-bs-theme-value="auto"
            aria-pressed="true"
          >
            <svg class="bi me-2 opacity-50" aria-hidden="true">
              <use href="#circle-half"></use>
            </svg>
            Auto
            <svg class="bi ms-auto d-none" aria-hidden="true">
              <use href="#check2"></use>
            </svg>
          </button>
        </li>
      </ul>
    </div>
    <div class="container">
      <main>
        <div class="py-5 text-center">
          <a href="index.html" class="d-inline-block mb-3">&larr; Back to menu</a>
          <h1 class="h2">Admin</h1>
          <p class="lead">
            Control which pizzas are on the menu and which states we operate in.
          </p>
        </div>

        <div class="row g-5 mb-5">
          <div class="col-12">
            <h2 class="mb-3">Pizzas</h2>
            <ul class="list-group mb-3" id="pizza-admin-list"></ul>
            <form id="new-pizza-form" class="row g-2">
              <div class="col-sm-3">
                <input class="form-control" name="name" id="new-pizza-name" placeholder="Name" required>
              </div>
              <div class="col-sm-2">
                <input class="form-control" type="number" step="0.01" name="price" id="new-pizza-price" placeholder="Price" required>
              </div>
              <div class="col-sm-3">
                <input class="form-control" name="imageURL" id="new-pizza-image" placeholder="Image URL" required>
              </div>
              <div class="col-sm-3">
                <input class="form-control" name="fancyImageURL" id="new-pizza-fancy-image" placeholder="Fancy image URL" required>
              </div>
              <div class="col-sm-1">
                <button type="submit" class="btn btn-primary w-100">Add</button>
              </div>
            </form>
          </div>
        </div>

        <div class="row g-5 mb-5">
          <div class="col-12">
            <h2 class="mb-3">States we operate in</h2>
            <ul class="list-group mb-3" id="state-admin-list"></ul>
            <form id="new-state-form" class="row g-2">
              <div class="col-sm-4">
                <input class="form-control" name="state" id="new-state-name" placeholder="State name" required>
              </div>
              <div class="col-sm-6">
                <input class="form-control" name="imageURL" id="new-state-image" placeholder="Pride box image URL" required>
              </div>
              <div class="col-sm-2">
                <button type="submit" class="btn btn-primary w-100">Add</button>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mb-5">
          <button type="button" class="btn btn-primary" id="save-changes-btn">Save changes</button>
        </div>
      </main>
      <footer class="my-5 pt-5 text-body-secondary text-center text-small">
        <p class="mb-1">&copy; 2026 Bonu assai! Pizza</p>
        <ul class="list-inline">
          <li class="list-inline-item"><a href="#">Privacy</a></li>
          <li class="list-inline-item"><a href="#">Terms</a></li>
          <li class="list-inline-item"><a href="#">Support</a></li>
        </ul>
      </footer>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
